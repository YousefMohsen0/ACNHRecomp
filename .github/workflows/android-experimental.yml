name: Experimental Android APK

on:
  push:
    branches: [phone-mali-framegen, touch-controls]
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # the last good build's artifact (its shader tool)

jobs:
  android:
    name: Android arm64 APK (game files excluded)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'

      - name: Regenerate embedded frame generation shaders
        run: |
          export PATH="$ANDROID_HOME/ndk/28.2.13676358/shader-tools/linux-x86_64:$PATH"
          python3 tools/gen_spirv_inc.py runtime/src/nvn/nvn_framegen_spirv.inc \
            kFgLuma=tools/shaders/framegen/luma.comp \
            kFgSearch=tools/shaders/framegen/search.comp \
            kFgSmooth=tools/shaders/framegen/smooth.comp \
            kFgSynth=tools/shaders/framegen/synth.comp \
            kFgBlend=tools/shaders/framegen/blend.comp

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang zip unzip zstd

      - name: Fetch Vulkan headers
        run: |
          mkdir -p private/third_party/Vulkan-Headers-1.4.357
          curl -fsSL https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.357.tar.gz \
            | tar -xz --strip-components=1 -C private/third_party/Vulkan-Headers-1.4.357

      - name: Fetch settings UI dependency
        run: |
          mkdir -p private/third_party/imgui
          curl -fsSL https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9.tar.gz \
            | tar -xz --strip-components=1 -C private/third_party/imgui

      # The shader tool (libspirv_harness.so) is built from Ryubing's source on Codeberg, which at times does not answer the
      # runners. Its source only changes with tools/build_shader_tool.py and tools/setup_acnh.py: when neither changed
      # since an earlier good build, that build's own copy of the tool (its APK) is used, and nothing is downloaded.
      - name: Fetch the last good build
        id: previous
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ACNHRecomp-experimental-android-arm64
          run-id: 44648189969
          github-token: ${{ github.token }}
          path: previous

      - name: Reuse its shader tool when its source is unchanged
        if: steps.previous.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          find previous -type f
          prev=$(cat "$(find previous -name COMMIT.txt | head -1)")
          git diff --quiet "$prev" HEAD -- tools/build_shader_tool.py tools/setup_acnh.py
          mkdir -p previous/apk private/android-tools/shaders
          unzip -o -q "$(find previous -name ACNHRecomp-experimental.apk | head -1)" lib/arm64-v8a/libspirv_harness.so -d previous/apk
          cp previous/apk/lib/arm64-v8a/libspirv_harness.so private/android-tools/shaders/spirv_harness
          chmod +x private/android-tools/shaders/spirv_harness
          echo "reusing the shader tool built for $prev"

      # The shader tool's source comes from Codeberg (SHA-256 checked by tools/build_shader_tool.py), which now and then
      # times out from the runners: kept from the last good run, and tried again when only that download failed.
      - name: Keep the shader tool's source
        uses: actions/cache@v4
        with:
          path: private/third_party/ryubing
          key: ryubing-${{ hashFiles('tools/build_shader_tool.py', 'tools/setup_acnh.py') }}

      - name: Build app APK without game files
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if tools/build_android.sh --no-game --jobs 2 2>&1 | tee build.log; then exit 0; fi
            grep -q "the shader tool did not build" build.log || exit 1
            echo "::warning::the shader tool's download failed (attempt $attempt of 4)"
            sleep 90
          done
          exit 1

      - name: Verify settings UI was compiled
        run: |
          if grep -q 'Dear ImGui not found' private/acnh/apk-app.cmake.log; then
            cat private/acnh/apk-app.cmake.log
            exit 1
          fi

      - name: Record build identity
        run: |
          cp private/acnh/apk-app/acnh.apk private/acnh/apk-app/ACNHRecomp-experimental.apk
          sha256sum private/acnh/apk-app/ACNHRecomp-experimental.apk > private/acnh/apk-app/SHA256SUMS.txt
          git rev-parse HEAD > private/acnh/apk-app/COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ACNHRecomp-experimental-android-arm64
          path: |
            private/acnh/apk-app/ACNHRecomp-experimental.apk
            private/acnh/apk-app/SHA256SUMS.txt
            private/acnh/apk-app/COMMIT.txt
            runtime/src/nvn/nvn_framegen_spirv.inc
          if-no-files-found: error
          retention-days: 14
